<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05040b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Strand Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL room; UI reads like an exhibition caption — vignette, quiet type, controls that recede when idle */
:root{
  --void:#05040b;
  --ink:#ece9ff;
  --ink-dim:rgba(236,233,255,.5);
  --ink-faint:rgba(236,233,255,.28);
  --line:rgba(200,188,255,.16);
  --led:#c9b8ff;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans:-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--ink);}
body{margin:0;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(2,1,6,.55) 100%),
    linear-gradient(to bottom, rgba(3,2,9,.72) 0, rgba(3,2,9,0) 16%, rgba(3,2,9,0) 74%, rgba(3,2,9,.82) 100%);}
.chrome{transition:opacity 1.6s ease;}
body.idle .chrome{opacity:0;}
body.idle .dock{opacity:.22;}
.hud{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-inline:clamp(16px,3vw,36px);}
.top{top:calc(env(safe-area-inset-top,0px) + clamp(16px,3vh,28px));}
.name{font-size:13px;letter-spacing:.45em;font-weight:300;color:var(--ink);text-shadow:0 0 18px rgba(201,184,255,.45);}
.name small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.32em;color:var(--ink-faint);margin-top:9px;font-weight:400;}
.meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums;line-height:1.9;text-transform:uppercase;}
.caption{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + clamp(16px,3vh,28px));text-align:center;pointer-events:none;
  font-size:12px;font-weight:300;letter-spacing:.5em;padding-left:.5em;color:var(--ink);opacity:0;transition:opacity 1.8s ease;text-shadow:0 0 16px rgba(201,184,255,.6);}
.caption.on{opacity:.9;}
.caption small{display:block;margin-top:8px;font-family:var(--mono);font-size:9px;letter-spacing:.4em;color:var(--ink-faint);}
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(14px,3vh,26px));display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(4px,1.6vw,18px);padding-inline:16px;transition:opacity 1.6s ease;}
.bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(4px,1.6vw,18px);}
.bar button,.bar .file{appearance:none;border:0;background:transparent;color:var(--ink-dim);font:300 12.5px/1 var(--sans);
  letter-spacing:.32em;padding:10px 4px 12px .32em;cursor:pointer;display:flex;align-items:center;gap:9px;position:relative;transition:color .4s;}
.bar button i{width:5px;height:5px;border-radius:50%;background:var(--c);opacity:.55;transition:box-shadow .4s, opacity .4s;}
.bar button:hover,.bar .file:hover,.bar .file:focus-within{color:var(--ink);}
.bar button[data-s][aria-pressed="true"]{color:var(--ink);}
.bar button[data-s][aria-pressed="true"] i{opacity:1;box-shadow:0 0 6px var(--c),0 0 14px var(--c);}
.bar button[data-s]::after{content:"";position:absolute;left:50%;bottom:2px;width:0;height:1px;background:var(--ink);opacity:.6;transition:width .5s,left .5s;}
.bar button[data-s][aria-pressed="true"]::after{left:22%;width:56%;}
.bar button:focus-visible,.bar .file:focus-within{outline:1px solid var(--led);outline-offset:2px;border-radius:4px;}
.sep{width:1px;height:14px;background:var(--line);margin-inline:4px;}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px;}
.eq b{width:2px;height:3px;background:currentColor;border-radius:1px;}
#music[aria-pressed="true"]{color:var(--ink);}
#music[aria-pressed="true"] .eq b{animation:eq 1.1s ease-in-out infinite;}
#music[aria-pressed="true"] .eq b:nth-child(2){animation-delay:-.4s}
#music[aria-pressed="true"] .eq b:nth-child(3){animation-delay:-.8s}
#music[aria-pressed="true"] .eq b:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.bar .file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.note{position:fixed;right:clamp(16px,3vw,36px);top:calc(env(safe-area-inset-top,0px) + clamp(16px,3vh,28px) + 44px);font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink-faint);pointer-events:none;text-align:right;max-width:50vw;}
.hint{position:fixed;left:0;right:0;text-align:center;padding-inline:20px;line-height:1.8;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(64px,9vh,84px));
  font-size:11px;font-weight:300;letter-spacing:.42em;color:var(--ink-faint);pointer-events:none;transition:opacity 1.2s;}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-dim);font-size:14px;}
@media (max-width:640px){
  .hud{padding-inline:20px}
  .name{font-size:12px;letter-spacing:.5em}
  .meta,.note,.sep{display:none}
  .caption{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font-size:15px}
  .dock{flex-direction:column;flex-wrap:nowrap;gap:10px;padding-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  .bar:not(.audio){flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;gap:2px;max-width:100%;padding-inline:20px;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 20px,#000 calc(100% - 28px),transparent 100%);
            mask-image:linear-gradient(to right,transparent 0,#000 20px,#000 calc(100% - 28px),transparent 100%);}
  .bar::-webkit-scrollbar{display:none}
  .bar button[data-s]{flex:0 0 auto;font-size:13px;letter-spacing:.18em;padding:12px 10px 14px}
  .audio{gap:10px}
  .audio #music,.audio .file{font-size:13px;letter-spacing:.2em;padding:11px 20px 11px calc(20px + .2em);border:1px solid var(--line);border-radius:999px;
    background:rgba(10,8,22,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .audio #music[aria-pressed="true"]{border-color:rgba(200,188,255,.5)}
  .hint{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 96px);letter-spacing:.24em;padding-inline:20px;line-height:1.8}
  body.idle .dock{opacity:.35}
}
@media (prefers-reduced-motion: reduce){ #music[aria-pressed="true"] .eq b{animation:none;height:7px} }
</style>

</head>
<body>
<canvas id="stage" aria-label="LED strand room. Tap to release light."></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="hud top chrome">
  <div class="name">STRAND ROOM<small>AN LED LIGHT INSTALLATION</small></div>
  <div class="meta" id="meta">— strands<br>— LEDs</div>
</div>
<div class="caption" id="caption" aria-live="polite"></div>
<div class="hint chrome" id="hint">CLICK TO BURST · TAP FAST OR HOLD FOR MORE · DRAG TO LOOK AROUND</div>
<div class="dock">
<div class="bar" role="group" aria-label="Scenes">
  <button data-s="-1" aria-pressed="true"><i style="--c:#ece9ff"></i>Auto</button>
  <button data-s="0" aria-pressed="false"><i style="--c:#a78bff"></i>Haze</button>
  <button data-s="1" aria-pressed="false"><i style="--c:#ff7ac8"></i>Rose</button>
  <button data-s="2" aria-pressed="false"><i style="--c:#ff9ab5"></i>Rain</button>
  <button data-s="3" aria-pressed="false"><i style="--c:#4f7dff"></i>Column</button>
  <button data-s="4" aria-pressed="false"><i style="--c:#ffffff"></i>Stars</button>
</div>
<span class="sep" aria-hidden="true"></span>
<div class="bar audio" role="group" aria-label="Music">
  <button id="music" aria-pressed="false"><span class="eq" aria-hidden="true"><b></b><b></b><b></b><b></b></span><span>Music</span></button>
  <label class="file" for="file">Import<input id="file" type="file" accept="audio/*"></label>
</div>
</div>
<div class="note chrome" id="musicNote" aria-live="polite"></div>

<script>
(() => {
// if the page is hot-updated while open, only the newest copy keeps rendering (two loops on one canvas = ghost frames)
const RUN = {}; window.__strandRun = RUN;
const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, premultipliedAlpha:false, powerPreference:'high-performance'});
if(!gl){ document.body.insertAdjacentHTML('beforeend','<div class="err">This browser does not support WebGL2. Try the latest Chrome or Safari.</div>'); return; }

const small = Math.min(innerWidth, innerHeight) < 600;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NX = small ? 32 : 48, NZ = NX, NY = small ? 44 : 64;
const SP = 0.6, ROOMH = 18.0, SCENE_DUR = 22;


// ---------- shaders ----------
const COMMON = `
float hash11(float p){ p = fract(p*0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec3 x){
  vec3 i = floor(x); vec3 f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), f.x), mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x), mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ float a=0.5, s=0.0; for(int k=0;k<4;k++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
`;
const VS = `#version 300 es
precision highp float;
in vec3 aPos; in float aSeed; in float aStrand;
uniform mat4 uVP; uniform float uTime, uScene, uScene2, uFade, uDim, uPx, uBright; uniform vec2 uMirror;
uniform vec4 uRip[6]; uniform vec4 uBurst[4]; uniform vec4 uBurstP[4]; uniform vec4 uCharge; uniform float uRain; uniform float uFlash; uniform vec4 uMouse; uniform vec4 uAudio; // level, bass, beat pulse, highs
out vec3 vCol;
#define ROOMH ${ROOMH.toFixed(1)}
${COMMON}
vec3 scene(float s, vec3 p, float seed, float strand, float t){
  float n  = fbm(p*0.16 + vec3(t*0.03, -t*0.12, t*0.06));
  float tw = 0.6 + 0.4*sin(t*3.0 + seed*40.0);
  float sp = step(0.996 - 0.012*uAudio.w, hash13(vec3(seed*91.0, floor(t*5.0 + seed*10.0), strand)));
  vec3 col;
  if(s < 0.5){
    float cl = pow(smoothstep(0.45,0.78,n),1.6);
    float core = exp(-pow(length(vec2(p.x, p.z+3.0))*0.2, 2.0)) * smoothstep(1.0, 7.0, p.y);
    col = vec3(0.20,0.10,0.55)*0.06 + vec3(0.55,0.35,1.0)*cl*1.5 + vec3(1.0,0.92,1.0)*core*(0.3+cl)*2.6;
    col += vec3(0.4,0.75,1.0)*sp*3.0;
  } else if(s < 1.5){
    float cl = pow(smoothstep(0.42,0.80,n),1.6);
    float core = exp(-pow(length(vec2(p.x, p.y-3.0))*0.32, 2.0)) * exp(-pow((p.z+2.0)*0.12, 2.0));
    col = vec3(0.50,0.16,0.45)*0.08 + vec3(1.0,0.35,0.8)*cl*0.9 + vec3(1.0,0.55,0.30)*core*(0.6+cl)*2.2;
    col += vec3(0.5,0.7,1.0)*sp*3.0;
  } else if(s < 2.5){
    float sh = hash11(strand*1.37 + 0.11);
    float spd = 0.35 + 0.6*sh;
    float ph = t*spd*0.12 + sh;
    float head = (1.0 - fract(ph))*ROOMH*1.4 - ROOMH*0.2;
    float dy = p.y - head;
    float trail = (dy > 0.0) ? exp(-dy*0.45) : exp(dy*6.0);
    float act = step(0.6, hash11(strand*7.1 + floor(ph)));
    vec3 tint = mix(vec3(1.0,0.40,0.60), vec3(0.92,0.88,1.0), hash11(strand*3.3));
    col = vec3(0.10,0.04,0.14)*0.12 + tint*trail*act*2.4;
    col += vec3(0.2,0.4,1.0)*sp*4.0;
  } else if(s < 3.5){
    float cl = pow(smoothstep(0.44,0.78,n),1.6);
    float column = exp(-pow(p.x*0.35, 2.0)) * exp(-pow((p.z+4.0)*0.15, 2.0));
    col = vec3(0.02,0.08,0.50)*0.10 + vec3(0.15,0.35,1.0)*cl*1.6 + vec3(0.8,0.95,1.0)*column*(0.5+cl)*2.2;
    col += vec3(0.8,0.9,1.0)*sp*3.0;
  } else {
    float flash = smoothstep(0.65, 1.0, sin(t*0.45)*0.5 + 0.5);
    float star = step(0.88 - 0.6*flash, hash13(vec3(seed*13.0, floor(t*3.0 + seed*7.0), strand)));
    col = vec3(0.12,0.12,0.32)*0.08 + vec3(0.85,0.88,1.0)*star*(1.4 + tw) + vec3(0.9,0.92,1.0)*flash*0.3;
  }
  return col;
}
vec3 ripple(vec4 r, vec3 p, float now, float idx){
  float age = now - r.w;
  if(age < 0.0 || age > 7.0) return vec3(0.0);
  float rad = age*5.5;
  float d = length(p - r.xyz);
  float ring = exp(-pow((d - rad)*1.4, 2.0)) * exp(-age*0.55);
  float core = exp(-d*d*0.35) * exp(-age*2.5);
  vec3 tint = mix(vec3(0.75,0.85,1.0), vec3(1.0,0.7,1.0), hash11(idx*3.7 + floor(r.w)));
  return tint*(ring*1.8 + core*2.6);
}
vec3 hue(float h){ return clamp(abs(mod(h*6.0 + vec3(0.0,4.0,2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }
// burst P = (power, hue, type, -) — type 0 tap: iridescent shockwave; 1 rapid combo: quick coloured rings; 2 charged release: huge gold-white blast
vec3 burst(vec4 b, vec4 P, inout vec3 p, float now, float seed, float idx){
  float age = now - b.w;
  if(age < 0.0 || age > 14.0) return vec3(0.0);
  float pw = P.x, ty = P.z;
  vec3 d3 = p - b.xyz; float d = length(d3);
  float speed = ty > 0.5 && ty < 1.5 ? 1.6 : (ty > 1.5 ? 0.7 : 1.0);
  float a = age*speed;
  float rad = (9.0*(1.0 - exp(-a*0.75)) + a*1.6) * mix(1.0, pw, 0.6);
  float fade = exp(-age*(ty > 1.5 ? 0.22 : (ty > 0.5 ? 0.6 : 0.38)));
  float width = ty > 1.5 ? 0.55 : (ty > 0.5 ? 1.6 : 0.9);
  float ring  = exp(-pow((d - rad)*width, 2.0)) * fade;
  float ring2 = exp(-pow((d - rad*0.55)*1.3, 2.0)) * fade * 0.55;
  float ang = atan(d3.z, d3.x)/6.2832 + d3.y*0.04;
  vec3 col;
  if(ty < 0.5){
    col = mix(vec3(0.92,0.9,1.0), mix(vec3(0.55,0.45,1.0), vec3(1.0,0.5,0.85), 0.5+0.5*sin(ang*12.566 + age*0.8 + idx)), 0.55);
    col = mix(col, hue(fract(ang + age*0.1 + idx*0.23))*0.8+0.2, 0.18);
  } else if(ty < 1.5){
    col = hue(fract(P.y + ang*0.15)); col = col*col*0.9 + 0.05;       // saturated combo colour
  } else {
    col = mix(vec3(1.0,0.82,0.55), vec3(1.0,0.97,0.92), 0.5+0.5*sin(ang*18.85 - age*2.0));   // warm gold-white
  }
  float push = ty > 1.5 ? 1.1*pw : (ty > 0.5 ? 0.3 : 0.55);
  p += (d3/max(d,0.001)) * ring * push + vec3(0.0, ring*push*0.6, 0.0);
  float dxz = length(d3.xz);
  float colW = ty > 1.5 ? 0.35 : 1.2;
  float column = (ty > 0.5 && ty < 1.5) ? 0.0 : exp(-dxz*dxz*colW) * smoothstep(age*14.0 + 1.0, age*14.0 - 3.0, p.y) * exp(-age*(ty > 1.5 ? 0.35 : 0.7));
  float core = exp(-d*d*(ty > 1.5 ? 0.2 : 0.6)) * exp(-age*3.0);
  float spk = ty > 1.5 ? 0.82 : 0.9;
  float sparkle = step(spk, hash11(seed*71.3 + floor(age*6.0))) * exp(-d*0.2) * exp(-age*(ty > 1.5 ? 0.25 : 0.45)) * step(d, rad);
  float gain = ty > 1.5 ? 1.3 : (ty > 0.5 ? 0.8 : 1.0);
  return gain*(col*(ring*4.2 + ring2*2.2) + mix(vec3(1.0,0.97,1.0), col, ty > 1.5 ? 0.4 : 0.0)*(column*4.0 + core*10.0) + mix(vec3(0.85,0.9,1.0), col, 0.4)*sparkle*2.8);
}
// held press: light gathers into a growing orb, nearby LEDs drift inward and flicker
vec3 charge(vec4 q, inout vec3 p, float t, float seed){
  if(q.w <= 0.0) return vec3(0.0);
  vec3 d3 = p - q.xyz; float d = length(d3);
  float r = 1.0 + q.w*5.0;
  float infl = exp(-d*d/(r*r));
  p -= d3 * infl * 0.18 * q.w;
  float flick = 0.6 + 0.4*sin(t*(18.0 + 30.0*q.w) + seed*50.0);
  float shell = exp(-pow((d - r*0.6)*1.5, 2.0)) * q.w;
  return mix(vec3(0.7,0.6,1.0), vec3(1.0,0.85,0.6), q.w) * (infl*flick*2.5*q.w + shell*2.0) + vec3(1.0,0.95,0.9)*exp(-d*d*(1.2 - q.w*0.8))*q.w*12.0;
}
// rapid-tap finale: light pours down every strand from the ceiling
vec3 rain(float r0, vec3 p, float t, float strand){
  float age = t - r0;
  if(age < 0.0 || age > 6.0) return vec3(0.0);
  float sh = hash11(strand*3.71);
  float head = ROOMH + 1.0 - (age - sh*0.8)*11.0;
  float dy = p.y - head;
  float tr = dy > 0.0 ? exp(-dy*0.35) : exp(dy*5.0);
  return (hue(fract(sh + age*0.08))*0.6 + 0.4) * tr * exp(-age*0.35) * 2.6;
}
void main(){
  vec3 p = aPos;
  float t = uTime;
  vec3 bc = vec3(0.0);
  for(int i=0;i<4;i++) bc += burst(uBurst[i], uBurstP[i], p, t, aSeed, float(i));
  bc += charge(uCharge, p, t, aSeed);
  bc += rain(uRain, p, t, aStrand);
  vec3 c = scene(uScene, p, aSeed, aStrand, t);
  // scene change: the new look sweeps outward through the room from the viewer, with a soft glowing front
  float edge = 0.0;
  if(uFade > 0.0){
    float k = length(p.xz - vec2(0.0, 6.0))/26.0 + abs(p.y - 4.0)/ROOMH*0.35 + hash11(aStrand*1.31 + aSeed)*0.07;
    float front = uFade*1.5 - 0.15;
    float lf = smoothstep(k - 0.12, k + 0.12, front);
    c = mix(c, scene(uScene2, p, aSeed, aStrand, t), lf);
    edge = exp(-pow((front - k)/0.07, 2.0)) * sin(uFade*3.1416);
    c += mix(vec3(0.75,0.7,1.0), vec3(1.0), 0.5) * edge * 1.4;
  }
  // music: overall level breathes the room, each beat lifts a wave of light off the floor
  c *= 0.78 + uAudio.x*0.45;
  float wave = exp(-pow((p.y - (1.0-uAudio.z)*ROOMH*0.95) * 0.9, 2.0)) * uAudio.z;
  c += mix(vec3(0.7,0.6,1.0), vec3(1.0), 0.4) * wave * (0.5 + uAudio.y) * 0.7;
  c += c * uAudio.y * 0.25 * exp(-p.y*0.12);
  for(int i=0;i<6;i++) c += ripple(uRip[i], p, t, float(i));
  c = c*(1.0 + uFlash*1.6) + bc + vec3(0.6,0.55,1.0)*uFlash*0.25;
  if(uMouse.w > 0.01){ float d = length(p - uMouse.xyz); c += vec3(0.9,0.95,1.0)*exp(-d*d*0.25)*2.0*uMouse.w; }
  c *= uBright * uDim;
  gl_Position = uVP * vec4(p.x, p.y*uMirror.x + uMirror.y, p.z, 1.0);
  float lum = max(c.r, max(c.g, c.b));
  float sz = uPx * 0.04 / max(gl_Position.w, 0.1);
  gl_PointSize = clamp(sz * (3.0 + 5.0*sqrt(min(lum, 3.0))), 1.5, 90.0);
  // keep energy roughly constant when the sprite is clamped up for far LEDs

const GVS = `#version 300 es

vec3 tap(vec2 uv, float d){

  float r = mix(texture(uScene, ur).r, c0.r, texture(uMask, ur).r);
